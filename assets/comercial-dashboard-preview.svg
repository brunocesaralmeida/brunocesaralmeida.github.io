<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Prévia anonimizada do dashboard de análise comercial</title>
  <desc id="desc">Painel com indicadores de CNPJs captados, honorários protegidos, evolução mensal, distribuição geográfica, grupos e regimes tributários.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081819"/><stop offset="1" stop-color="#102627"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#45b979"/><stop offset="1" stop-color="#78d59c"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter>
    <style>.label{font:700 13px Inter,Arial,sans-serif;letter-spacing:.04em;fill:#5dce8a}.value{font:800 30px Inter,Arial,sans-serif;fill:#f3f8f4}.muted{font:500 12px Inter,Arial,sans-serif;fill:#8da2a0}.axis{font:500 10px Inter,Arial,sans-serif;fill:#819391}.title{font:800 17px Inter,Arial,sans-serif;fill:#f6faf7}.small{font:700 11px Inter,Arial,sans-serif;fill:#b7c6c3}.line{stroke:#233d3e;stroke-width:1}.panel{fill:#102526;stroke:#244243;stroke-width:1}</style>
  </defs>
