<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Prévia anonimizada do dashboard Captação Novos Clientes</title>
  <desc id="desc">Recriação pública do painel em fundo branco e verde, com filtros, quatro indicadores, gráficos mensais, divisão por regime, grupos anonimizados e distribuição geográfica.</desc>
  <defs>
