    <style>.panel{fill:#53b8aa;stroke:#0c7465;stroke-width:2}.head{fill:#087765}.title{font:800 37px Inter,Arial,sans-serif;fill:#087765}.pt{font:800 15px Inter,Arial,sans-serif;fill:#fff}.kpi{font:800 21px Inter,Arial,sans-serif;fill:#063f38}.label{font:700 11px Inter,Arial,sans-serif;fill:#173b38}.small{font:600 9px Inter,Arial,sans-serif;fill:#173b38}.bar{fill:#117a69}</style>
