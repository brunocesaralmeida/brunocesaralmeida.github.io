<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Prévia ilustrativa do dashboard de gestão da carteira</title>
  <desc id="desc">Composição visual sanitizada, sem números, empresas ou informações da operação real.</desc>
